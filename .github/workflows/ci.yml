name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Run the quality gate
        run: zig fmt --check . && zig build lint && zig build test
      - run: zig build -Doptimize=ReleaseSafe

  conformance:
    name: Autobahn conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Run the Autobahn suite without the slow 9.* cases
        run: zig build autobahn -Dquick
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-report
          path: reports/
