name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZIG_VERSION: 0.17.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check . && zig build lint && zig build test
      - name: Build targets
        run: |
          mkdir dist
          for target in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos; do
            zig build -Doptimize=ReleaseSafe -Dtarget=$target --prefix "out/$target"
            tar -czf "dist/quetzal-${GITHUB_REF_NAME}-$target.tar.gz" -C "out/$target/bin" quetzal
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
